<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Vibe</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483, #e94560);
      background-size: 600% 600%;
      animation: sunrise 20s ease-in-out infinite;
      transition: background 0.3s;
    }

    @keyframes sunrise {
      0%   { background-position: 0% 50%; }
      25%  { background-position: 100% 0%; }
      50%  { background-position: 100% 100%; }
      75%  { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 640px;
      width: 90%;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .date-display {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 2.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }

    .quote-mark {
      font-size: 5rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.15);
      font-family: Georgia, 'Times New Roman', serif;
      margin-bottom: -1.5rem;
      user-select: none;
    }

    .quote-text {
      font-size: 1.75rem;
      font-weight: 500;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 1.5rem;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .quote-text.fade {
      opacity: 0;
      transform: translateY(10px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.85);
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      letter-spacing: 0.02em;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.spin svg {
      animation: spin 0.5s ease-in-out;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .btn svg {
      width: 16px;
      height: 16px;
      opacity: 0.8;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="date-display" id="dateDisplay"></div>
    <div class="card">
      <div class="quote-mark">&ldquo;</div>
      <div class="quote-text" id="quoteText"></div>
      <button class="btn" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        refresh vibe
      </button>
    </div>
    <div class="footer">today is yours</div>
  </div>

  <script>
    const quotes = [
      "The only way to do great work is to love what you do.",
      "Believe you can and you're halfway there.",
      "What lies behind us and what lies before us are tiny matters compared to what lies within us.",
      "It does not matter how slowly you go as long as you do not stop.",
      "The future belongs to those who believe in the beauty of their dreams.",
      "You are never too old to set another goal or to dream a new dream.",
      "Act as if what you do makes a difference. It does.",
      "Success is not final, failure is not fatal: it is the courage to continue that counts.",
      "In the middle of every difficulty lies opportunity.",
      "The best time to plant a tree was 20 years ago. The second best time is now.",
      "Stay close to anything that makes you glad you are alive.",
      "You must be the change you wish to see in the world.",
      "Everything you've ever wanted is on the other side of fear.",
      "The only limit to our realization of tomorrow is our doubts of today.",
      "Do what you can, with what you have, where you are.",
      "No pressure, no diamonds.",
      "Your vibe attracts your tribe.",
      "Small steps every day add up to big results.",
      "Let your dreams be bigger than your fears.",
      "Happiness is not by chance, but by choice.",
    ];

    const quoteEl = document.getElementById('quoteText');
    const dateEl = document.getElementById('dateDisplay');
    const refreshBtn = document.getElementById('refreshBtn');

    let lastIndex = -1;

    function formatDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return now.toLocaleDateString('en-US', options);
    }

    function randomQuote() {
      let idx;
      do {
        idx = Math.floor(Math.random() * quotes.length);
      } while (idx === lastIndex && quotes.length > 1);
      lastIndex = idx;
      return quotes[idx];
    }

    function setQuote(text, animate = false) {
      if (animate) {
        quoteEl.classList.add('fade');
        setTimeout(() => {
          quoteEl.textContent = text;
          quoteEl.classList.remove('fade');
        }, 200);
      } else {
        quoteEl.textContent = text;
      }
    }

    function refresh() {
      setQuote(randomQuote(), true);
      refreshBtn.classList.add('spin');
      setTimeout(() => refreshBtn.classList.remove('spin'), 500);
    }

    // Init
    dateEl.textContent = formatDate();
    setQuote(randomQuote());

    refreshBtn.addEventListener('click', refresh);

    // Keyboard shortcut: space bar
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        refresh();
      }
    });
  </script>
</body>
</html>
